<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Analog Clock Widget</title>

<style>
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #7da7d9;
    display: flex;
    justify-content: center;
    align-items: center;
}

.clock {
    width: 75%;
    aspect-ratio: 1 / 1;
    border: 6px solid #3f3f3f;
    border-radius: 50%;
    position: relative;
    box-sizing: border-box;
}

.hand {
    position: absolute;
    background: #3f3f3f;
    transform-origin: bottom center;
    left: 50%;
    bottom: 50%;
    border-radius: 5px;
    transform: translateX(-50%) rotate(0deg);
}

.hour {
    width: 6px;
    height: 25%;
}

.minute {
    width: 4px;
    height: 35%;
}

.second {
    width: 2px;
    height: 40%;
}

.center {
    width: 12px;
    height: 12px;
    background: #3f3f3f;
    border-radius: 50%;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}

.number {
    position: absolute;
    color: #3f3f3f;
    font-family: Arial, sans-serif;
    font-size: 14px;
    font-weight: bold;
}

.n12 { top: 6%; left: 50%; transform: translateX(-50%); }
.n3  { right: 6%; top: 50%; transform: translateY(-50%); }
.n6  { bottom: 6%; left: 50%; transform: translateX(-50%); }
.n9  { left: 6%; top: 50%; transform: translateY(-50%); }

</style>
</head>

<body>

<div class="clock">

    <div class="number n12">12</div>
    <div class="number n3">3</div>
    <div class="number n6">6</div>
    <div class="number n9">9</div>

    <div class="hand hour" id="hour"></div>
    <div class="hand minute" id="minute"></div>
    <div class="hand second" id="second"></div>

    <div class="center"></div>

</div>


<script>
function updateClock() {
    const now = new Date();

    const seconds = now.getSeconds();
    const minutes = now.getMinutes();
    const hours = now.getHours();

    const secondAngle = seconds * 6;
    const minuteAngle = minutes * 6 + seconds * 0.1;
    const hourAngle = (hours % 12) * 30 + minutes * 0.5;

    document.getElementById("second").style.transform =
        `translateX(-50%) rotate(${secondAngle}deg)`;

    document.getElementById("minute").style.transform =
        `translateX(-50%) rotate(${minuteAngle}deg)`;

    document.getElementById("hour").style.transform =
        `translateX(-50%) rotate(${hourAngle}deg)`;
}

setInterval(updateClock, 1000);
updateClock();
</script>

</body>
</html>
