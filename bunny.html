<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notion Bunny Widget</title>
  <!-- Süsse Pixel-Schriftart laden -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Press Start 2P', monospace;
    }

    .widget-card {
      width: 280px;
      height: 280px;
      background-color: #ffffff;
      border: 3px solid #000000;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      text-align: center;
    }

    .bunny-container {
      position: relative;
      width: 110px;
      height: 110px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bunny {
      width: 100px;
      height: 100px;
      image-rendering: pixelated;
      transition: transform 0.2s ease;
    }

    /* Animation beim Füttern */
    .happy {
      animation: bounce 0.6s ease infinite alternate;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }

    .btn-feed {
      font-family: 'Press Start 2P', monospace;
      font-size: 11px;
      background-color: #ffb7c5;
      color: #ffffff;
      border: 2px solid #000000;
      border-radius: 20px;
      padding: 10px 16px;
      cursor: pointer;
      box-shadow: 0 4px 0 #000000;
      transition: all 0.1s ease;
      outline: none;
    }

    .btn-feed:active {
      box-shadow: 0 0 0 #000000;
      transform: translateY(4px);
    }

    .btn-feed:disabled {
      background-color: #e0e0e0;
      color: #a0a0a0;
      cursor: not-allowed;
      box-shadow: 0 2px 0 #777777;
    }

    .status-text {
      font-size: 8px;
      line-height: 1.4;
      color: #555555;
      min-height: 24px;
      display: flex;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="widget-card">
    <div class="bunny-container">
      <!-- Der Pixel-Hase aus deinem Bild als Vektorgrafik eingebettet -->
      <svg class="bunny" id="bunny" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
        <!-- Outlines -->
        <path fill="#000" d="M8 3h1v1H8zM9 4h1v3H9zM10 3h1v1h-1zM11 4h1v3h-1zM7 4h1v1H7zM6 5h1v2H6zM5 7h1v1H5zM4 8h1v5H4zM5 13h1v1H5zM6 14h5v1H6zM11 13h1v1h-1zM12 8h1v5h-1zM8 7h1v1H8z"/>
        <!-- Körper (Weiß) -->
        <path fill="#fff" d="M8 4h1v3H8zM10 4h1v3h-1zM7 5h2v2H7zM6 7h5v1H6zM5 8h7v5H5zM6 13h5v1H6z"/>
        <!-- Ohr-Rosa -->
        <path fill="#ffd0d7" d="M8 5h1v2H8zM10 5h1v2h-1z"/>
        <!-- Blümchen (Gelb & Rot & Blau) -->
        <path fill="#fdd835" d="M7 6h1v1H7z"/>
        <path fill="#e57373" d="M8 6h1v1H8zM7 5h1v1H7z"/>
        <path fill="#78909c" d="M6 6h1v1H6zM6 7h1v1H6z"/>
        <!-- Augen & Bäckchen -->
        <path fill="#000" d="M8 10h2v1H8zM12 10h1v1h-1z"/>
        <path fill="#ffb7c5" d="M7 11h2v1H7zM12 11h1v1h-1z"/>
        <!-- Nase (Rosa) -->
        <path fill="#f8bbd0" d="M10 11h1v1h-1z"/>
      </svg>
    </div>

    <button class="btn-feed" id="feedBtn">feed me!&lt;3</button>
    <div class="status-text" id="statusText">you haven't fed your bunny yet</div>
  </div>

  <script>
    const feedBtn = document.getElementById('feedBtn');
    const statusText = document.getElementById('statusText');
    const bunny = document.getElementById('bunny');

    // Funktion um den Reset-Zeitpunkt (heute/gestern 06:00 Uhr) zu ermitteln
    function getLastResetTime() {
      const now = new Date();
      const reset = new Date(now);
      reset.setHours(6, 0, 0, 0); // 6:00 Uhr morgens
      
      // Wenn es heute vor 6 Uhr morgens ist, war der letzte Reset gestern um 6 Uhr
      if (now < reset) {
        reset.setDate(reset.getDate() - 1);
      }
      return reset.getTime();
    }

    function checkFedStatus() {
      const lastFedTimestamp = localStorage.getItem('bunny_last_fed');
      const lastReset = getLastResetTime();

      if (lastFedTimestamp && parseInt(lastFedTimestamp) > lastReset) {
        // Hase wurde nach dem letzten 6-Uhr-Reset gefüttert
        setFedState(true);
      } else {
        // Hase wurde noch nicht gefüttert
        setFedState(false);
      }
    }

    function setFedState(isFed) {
      if (isFed) {
        feedBtn.disabled = true;
        statusText.innerText = "well done! come back tomorrow!";
        bunny.classList.add('happy');
      } else {
        feedBtn.disabled = false;
        statusText.innerText = "you haven't fed your bunny yet";
        bunny.classList.remove('happy');
      }
    }

    feedBtn.addEventListener('click', () => {
      localStorage.setItem('bunny_last_fed', Date.now());
      setFedState(true);
    });

    // Prüfe beim Laden
    checkFedStatus();
  </script>
</body>
</html>
