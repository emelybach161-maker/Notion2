<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion Flip Clock Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #7da7d9; /* Background Color */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Arial Black', Gadget, sans-serif;
      overflow: hidden;
    }

    .flip-clock {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .card {
      position: relative;
      background-color: rgba(0, 0, 0, 0.15); /* Slightly darker card backdrop */
      border-radius: 12px;
      padding: 16px 20px;
      min-width: 80px;
      text-align: center;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    .number {
      font-size: 3.5rem;
      font-weight: bold;
      color: #ffffff; /* White Numbers */
      line-height: 1;
      letter-spacing: -2px;
    }

    /* Horizontal dividing line for the flip effect look */
    .card::after {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      width: 100%;
      height: 2px;
      background-color: rgba(0, 0, 0, 0.12);
    }

    .colon {
      font-size: 3rem;
      color: #ffffff;
      font-weight: bold;
      margin-top: -8px;
    }

    .label {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 6px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <div class="flip-clock">
    <div class="card">
      <div class="number" id="hours">00</div>
      <div class="label">Hours</div>
    </div>
    <div class="colon">:</div>
    <div class="card">
      <div class="number" id="minutes">00</div>
      <div class="label">Minutes</div>
    </div>
    <div class="colon">:</div>
    <div class="card">
      <div class="number" id="seconds">00</div>
      <div class="label">Seconds</div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');

      document.getElementById('hours').textContent = hours;
      document.getElementById('minutes').textContent = minutes;
      document.getElementById('seconds').textContent = seconds;
    }

    setInterval(updateClock, 1000);
    updateClock();
  </script>

</body>
</html>
