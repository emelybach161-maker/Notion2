<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Mondphasen Widget</title>
  <style>
    :root {
      --primary-blue: #7da7d9;
      --soft-bg: #131c2e;
      --card-bg: #1a273e;
      --text-color: #e2ebf8;
      --font-pixel: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: transparent;
      font-family: var(--font-pixel);
      color: var(--text-color);
    }

    .widget-container {
      background: var(--card-bg);
      border: 3px solid var(--primary-blue);
      border-radius: 20px;
      padding: 18px 22px;
      width: 280px;
      text-align: center;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
      position: relative;
    }

    /* Süße Pixel-Sterne */
    .star {
      position: absolute;
      font-size: 10px;
      color: var(--primary-blue);
      animation: twinkle 2s infinite alternate;
    }
    .star-1 { top: 12px; left: 18px; font-size: 12px; }
    .star-2 { top: 25px; right: 20px; font-size: 8px; color: #ffffff; animation-delay: 0.5s; }
    .star-3 { bottom: 18px; left: 22px; font-size: 9px; animation-delay: 1s; }
    .star-4 { bottom: 12px; right: 18px; font-size: 11px; color: #ffffff; animation-delay: 1.5s; }

    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    /* Datum Anzeige */
    .date-display {
      font-size: 12px;
      font-weight: bold;
      color: var(--primary-blue);
      letter-spacing: 1px;
      margin-bottom: 15px;
      padding-bottom: 6px;
      border-bottom: 2px dashed rgba(125, 167, 217, 0.4
