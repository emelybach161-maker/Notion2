<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Mondphasen Widget</title>
  <style>
    :root {
      --primary-blue: #7da7d9;
      --card-bg: #1c233a;
      --moon-bg: #111526;
      --text-color: #e2ebf8;
      --font-pixel: 'Courier New', Courier, monospace;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: transparent;
      font-family: var(--font-pixel);
      color: var(--text-color);
    }

    .widget-container {
      background: var(--card-bg);
      border: 3px solid var(--primary-blue);
      border-radius: 20px;
      padding: 18px 20px;
      width: 280px;
      text-align: center;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    /* Funkelnde Pixel-Sterne außen */
    .star {
      position: absolute;
      color: var(--primary-blue);
      animation: twinkle 2s infinite alternate ease-in-out;
    }
    .star-1 { top: 12px; left: 16px; font-size: 11px; }
    .star-2 { top: 22px; right: 18px; font-size: 8px; color: #ffffff; animation-delay: 0.5s; }
    .star-3 { bottom: 16px; left: 20px; font-size: 9px; animation-delay: 1s; }
    .star-4 { bottom: 12px; right: 16px; font-size: 12px; color: #ffffff; animation-delay: 1.5s; }

    @keyframes twinkle {
      0% { opacity: 0.3; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    /* Datum Anzeige */
    .date-display {
      font-size: 13px;
      font-weight: bold;
      color: var(--primary-blue);
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px dashed rgba(125, 167, 217, 0.3);
    }

    /* Canvas/SVG Container */
    .moon-stage {
      width: 96px;
      height: 96px;
      margin: 8px auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .moon-svg {
      width: 96px;
      height: 96px;
      image-rendering: pixelated;
    }

    /* Phasen Name & Info */
    .phase-name {
      font-size: 14px;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 4px;
    }

    .phase-details {
      font-size: 11px;
      color: var(--primary-blue);
      opacity: 0.95;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <span class="star star-1">✦</span>
    <span class="star star-2">★</span>
    <span class="star star-3">✧</span>
    <span class="star star-4">✦</span>

    <div class="date-display" id="date-display">...</div>
    <div class="moon-stage" id="moon-stage"></div>
    <div class="phase-name" id="phase-name">Lade Mond...</div>
    <div class="phase-details" id="phase-details">--</div>
  </div>

  <script>
    function updateMoonWidget() {
      try {
        const now = new Date();

        // 1. Datum auf Deutsch
        const options = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
        document.getElementById('date-display').innerText = now.toLocaleDateString('de-DE', options);

        // 2. Mondphasen-Berechnung
        const knownNewMoon = new Date(2024, 0, 11, 11, 57);
        const diffTime = now.getTime() - knownNewMoon.getTime();
        const diffDays = diffTime / (1000 * 60 * 60 * 24);
        const cycle = 29.53058867;
        const age = (diffDays % cycle + cycle) % cycle;
        const illuminatedFraction = (1 - Math.cos((age / cycle) * 2 * Math.PI)) / 2;
        const percent = Math.round(illuminatedFraction * 100);

        let phaseName = "";
        let svgContent = "";

        // Farben basierend auf #7da7d9 & deinen Twitch-Badges
        const border = "#1a1e2e";
        const darkSide = "#48386b"; // Niedliches Pixel-Dunkellila
        const lightSide = "#e8eef9"; // Pastell Weiß/Hellblau
        const starColor = "#7da7d9"; // Deine Wunschfarbe für Sterne
        const gold = "#fcd34d";

        // Pixel-Mond Vorlagen (SVGs im 16x16 Pixel Grid)
        const starsOverlay = `
          <rect x="5" y="4" width="1" height="1" fill="${starColor}"/>
          <rect x="10" y="5" width="1" height="1" fill="#ffffff"/>
          <rect x="6" y="10" width="1" height="1" fill="#ffffff"/>
          <rect x="11" y="9" width="1" height="1" fill="${starColor}"/>
          <rect x="8" y="7" width="1" height="1" fill="${starColor}"/>
        `;

        if (age < 1.84) {
          phaseName = "Neumond";
          svgContent = `<circle cx="8" cy="8" r="7" fill="${darkSide}" stroke="${border}" stroke-width="1"/>${starsOverlay}`;
        } else if (age < 5.53) {
          phaseName = "Zunehmende Sichel";
          svgContent = `
            <circle cx="8" cy="8" r="7" fill="${darkSide}" stroke="${border}" stroke-width="1"/>
            ${starsOverlay}
            <path d="M8 1 A7 7 0 0 1 15 8 A7 7 0 0 1 8 15 A5 7 0 0 0 8 1 Z" fill="${lightSide}"/>
          `;
        } else if (age < 9.22) {
          phaseName = "Erstes Viertel";
          svgContent = `
            <circle cx="8" cy="8" r="7" fill="${darkSide}" stroke="${border}" stroke-width="1"/>
            ${starsOverlay}
            <path d="M8 1 A7 7 0 0 1 8 15 Z" fill="${lightSide}"/>
          `;
        } else if (age < 12.91) {
          phaseName = "Zunehmender Mond";
          svgContent = `
            <circle cx="8" cy="8" r="7" fill="${lightSide}" stroke="${border}" stroke-width="1"/>
            <path d="M8 1 A5 7 0 0 0 8 15 A7 7 0 0 1 8 1 Z" fill="${darkSide}"/>
            <rect x="5" y="6" width="1" height="1" fill="${starColor}"/>
          `;
        } else if (age < 16.61) {
          phaseName = "Vollmond";
          svgContent = `
            <circle cx="8" cy="8" r="7" fill="${lightSide}" stroke="${border}" stroke-width="1"/>
            <rect x="4" y="5" width="2" height="2" fill="${starColor}" opacity="0.5"/>
            <rect x="10" y="8" width="2" height="3" fill="${starColor}" opacity="0.5"/>
            <rect x="6" y="11" width="3" height="1" fill="${starColor}" opacity="0.5"/>
          `;
        } else if (age < 20.30) {
          phaseName = "Abnehmender Mond";
          svgContent = `
            <circle cx="8" cy="8" r="7" fill="${lightSide}" stroke="${border}" stroke-width="1"/>
            <path d="M8 1 A5 7 0 0 1 8 15 A7 7 0 0 1 8 1 Z" fill="${darkSide}"/>
            <rect x="10" y="6" width="1" height="1" fill="${starColor}"/>
          `;
        } else if (age < 23.99) {
          phaseName = "Letztes Viertel";
          svgContent = `
            <circle cx="8" cy="8" r="7" fill="${darkSide}" stroke="${border}" stroke-width="1"/>
            ${starsOverlay}
            <path d="M8 1 A7 7 0 0 0 8 15 Z" fill="${lightSide}"/>
          `;
        } else if (age < 27.68) {
          phaseName = "Abnehmende Sichel";
          svgContent = `
            <circle cx="8" cy="8" r="7" fill="${darkSide}" stroke="${border}" stroke-width="1"/>
            ${starsOverlay}
            <path d="M8 1 A7 7 0 0 0 1 8 A7 7 0 0 0 8 15 A5 7 0 0 1 8 1 Z" fill="${lightSide}"/>
          `;
        } else {
          phaseName = "Neumond";
          svgContent = `<circle cx="8" cy="8" r="7" fill="${darkSide}" stroke="${border}" stroke-width="1"/>${starsOverlay}`;
        }

        const fullSvg = `<svg class="moon-svg" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">${svgContent}</svg>`;

        document.getElementById('moon-stage').innerHTML = fullSvg;
        document.getElementById('phase-name').innerText = phaseName;
        document.getElementById('phase-details').innerText = `${percent}% Beleuchtung • Tag ${Math.floor(age)}`;
      } catch (err) {
        console.error("Fehler beim Laden des Widgets:", err);
      }
    }

    // Sofort ausführen
    updateMoonWidget();
  </script>
</body>
</html>
