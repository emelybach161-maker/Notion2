<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pastel Pomodoro Timer</title>
  <style>
    :root {
      --bg-main: #fcf4dd;
      --shadow-color: #bb8a52;
      --display-bg: #8baaa8;
      --display-text: #1a1a1a;
      --btn-bg: #f4acb7;
      --btn-border: #d08c99;
      --card-bg: #fff9e6;
      --card-border: #f7d6b3;
      --text-main: #2b2b2b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 15px;
      font-family: 'Courier New', Courier, monospace;
      background-color: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .pomodoro-container {
      width: 100%;
      max-width: 350px;
      background: var(--bg-main);
      border-radius: 28px;
      padding: 20px;
      position: relative;
      box-shadow: 6px 6px 0px var(--shadow-color);
      display: flex;
      flex-direction: column;
      gap: 15px;
      border: 3px solid #e2c097;
    }

    /* Top Main Display */
    .main-display {
      background: var(--display-bg);
      border-radius: 18px;
      padding: 15px;
      text-align: center;
      border: 2px solid #759492;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
    }

    .timer-text {
      font-size: 48px;
      font-weight: bold;
      color: var(--display-text);
      letter-spacing: 2px;
      line-height: 1;
      margin: 5px 0 0 0;
    }

    /* Sub Display / Status Bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .session-badge {
      background: var(--display-bg);
      border: 2px solid #759492;
      border-radius: 12px;
      padding: 6px 14px;
      font-weight: bold;
      font-size: 14px;
      color: var(--display-text);
      flex: 1;
      margin-right: 15px;
    }

    /* Action Controls (Play/Pause, Reset) */
    .action-btns {
      display: flex;
      gap: 10px;
    }

    .round-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--btn-bg);
      border: 2px solid var(--btn-border);
      box-shadow: 0 3px 0 var(--btn-border);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-main);
      transition: all 0.1s ease;
    }

    .round-btn:active {
      transform: translateY(3px);
      box-shadow: none;
    }

    /* Settings Cards Grid */
    .settings-grid {
      display: flex;
      gap: 12px;
    }

    .setting-card {
      flex: 1;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .setting-title {
      font-size: 11px;
      font-weight: bold;
      color: var(--text-main);
      text-align: center;
    }

    .setting-value {
      font-size: 24px;
      font-weight: bold;
      color: var(--text-main);
    }

    .adjust-btns {
      display: flex;
      gap: 8px;
    }

    .small-btn {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--btn-bg);
      border: 2px solid var(--btn-border);
      box-shadow: 0 2px 0 var(--btn-border);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .small-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div class="pomodoro-container">
    
    <div class="main-display">
      <div class="timer-text" id="time-display">25:00</div>
    </div>

    <div class="status-bar">
      <div class="session-badge" id="mode-display">Session</div>
      <div class="action-btns">
        <button class="round-btn" id="start-btn" onclick="toggleTimer()">▶</button>
        <button class="round-btn" onclick="resetTimer()">🔄</button>
      </div>
    </div>

    <div class="settings-grid">
      
      <div class="setting-card">
        <div class="setting-title">Break Length</div>
        <div class="setting-value" id="break-val">5</div>
        <div class="adjust-btns">
          <button class="small-btn" onclick="changeLength('break', 1)">↑</button>
          <button class="small-btn" onclick="changeLength('break', -1)">↓</button>
        </div>
      </div>

      <div class="setting-card">
        <div class="setting-title">Session Length</div>
        <div class="setting-value" id="session-val">25</div>
        <div class="adjust-btns">
          <button class="small-btn" onclick="changeLength('session', 1)">↑</button>
          <button class="small-btn" onclick="changeLength('session', -1)">↓</button>
        </div>
      </div>

    </div>

  </div>

  <script>
    let sessionLength = 25;
    let breakLength = 5;
    
    let currentMode = 'Session'; // 'Session' oder 'Break'
    let timeLeft = sessionLength * 60;
    let timerId = null;
    let isRunning = false;

    const timeDisplay = document.getElementById('time-display');
    const modeDisplay = document.getElementById('mode-display');
    const startBtn = document.getElementById('start-btn');
    const sessionVal = document.getElementById('session-val');
    const breakVal = document.getElementById('break-val');

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    function updateDisplay() {
      timeDisplay.innerText = formatTime(timeLeft);
      modeDisplay.innerText = currentMode;
    }

    function toggleTimer() {
      if (isRunning) {
        clearInterval(timerId);
        isRunning = false;
        startBtn.innerText = '▶';
      } else {
        isRunning = true;
        startBtn.innerText = '❚❚';
        timerId = setInterval(() => {
          if (timeLeft > 0) {
            timeLeft--;
            updateDisplay();
          } else {
            // Wechsel zwischen Pause & Arbeits-Session
            if (currentMode === 'Session') {
              currentMode = 'Break';
              timeLeft = breakLength * 60;
            } else {
              currentMode = 'Session';
              timeLeft = sessionLength * 60;
            }
            updateDisplay();
          }
        }, 1000);
      }
    }

    function resetTimer() {
      clearInterval(timerId);
      isRunning = false;
      startBtn.innerText = '▶';
      currentMode = 'Session';
      timeLeft = sessionLength * 60;
      updateDisplay();
    }

    function changeLength(type, amount) {
      if (isRunning) return; // Während der Timer läuft, keine Zeit ändern

      if (type === 'session') {
        sessionLength = Math.max(1, Math.min(60, sessionLength + amount));
        sessionVal.innerText = sessionLength;
        if (currentMode === 'Session') {
          timeLeft = sessionLength * 60;
          updateDisplay();
        }
      } else if (type === 'break') {
        breakLength = Math.max(1, Math.min(30, breakLength + amount));
        breakVal.innerText = breakLength;
        if (currentMode === 'Break') {
          timeLeft = breakLength * 60;
          updateDisplay();
        }
      }
    }

    updateDisplay();
  </script>
</body>
</html>
