<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notion Analog Clock Widget</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #ffffff; /* White Background */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .clock {
      width: 200px;
      height: 200px;
      border: 8px solid #000000; /* Black Outer Ring */
      border-radius: 50%;
      position: relative;
      background-color: #ffffff;
    }

    /* Center Dot */
    .clock::after {
      content: '';
      position: absolute;
      width: 12px;
      height: 12px;
      background-color: #333333; /* Dark Gray Center */
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    /* Shared Hand Styling */
    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      transform-origin: bottom center;
      background-color: #333333; /* Dark Gray Hands */
      border-radius: 4px;
      z-index: 5;
    }

    .hour-hand {
      width: 6px;
      height: 55px;
      margin-left: -3px;
    }

    .minute-hand {
      width: 4px;
      height: 75px;
      margin-left: -2px;
    }

    .second-hand {
      width: 2px;
      height: 85px;
      margin-left: -1px;
      background-color: #555555; /* Slightly Lighter Dark Gray */
    }
  </style>
</head>
<body>

  <div class="clock">
    <div class="hand hour-hand" id="hour"></div>
    <div class="hand minute-hand" id="minute"></div>
    <div class="hand second-hand" id="second"></div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const seconds = now.getSeconds();
      const minutes = now.getMinutes();
      const hours = now.getHours();

      // Calculate degrees for rotations
      const secondDeg = (seconds / 60) * 360;
      const minuteDeg = ((minutes + seconds / 60) / 60) * 360;
      const hourDeg = ((hours % 12 + minutes / 60) / 12) * 360;

      document.getElementById('second').style.transform = `rotate(${secondDeg}deg)`;
      document.getElementById('minute').style.transform = `rotate(${minuteDeg}deg)`;
      document.getElementById('hour').style.transform = `rotate(${hourDeg}deg)`;
    }

    // Update every second
    setInterval(updateClock, 1000);
    updateClock(); // Initial call
  </script>

</body>
</html>
